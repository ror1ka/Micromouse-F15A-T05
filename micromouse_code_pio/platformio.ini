; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Per-machine settings (upload_port, etc.) live in platformio_local.ini, which is
; gitignored. Copy platformio_local.ini.example and set your own port.
extra_configs = platformio_local*.ini

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino

; upload_port is machine-specific -- set it in platformio_local.ini:
;   Windows: COM5        macOS: /dev/cu.usbserial-AQ02VZ1Q        Linux: /dev/ttyUSB0
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_speed = 115200
lib_deps =
	rfetick/MPU6050_light@^1.1.0
	pololu/VL6180X@^1.4.0
	olikraus/U8g2@^2.36.18
