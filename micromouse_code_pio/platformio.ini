; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Per-machine settings (upload_port, etc.) live in platformio_local.ini, which is
; gitignored. Copy platformio_local.ini.example and set your own port.
extra_configs = platformio_local*.ini

[env:nano]
t platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino

; upload_port is machine-specific -- set it in platformio_local.ini:
;   Windows: COM5        macOS: /dev/cu.usbserial-AQ02VZ1Q        Linux: /dev/ttyUSB0
monitor_speed = 115200
upload_speed = 115200

; The core's default 64-byte Serial buffers cost 128 bytes of a 2KB RAM budget,
; and this robot only ever prints short diagnostic lines. Shrinking them buys
; back stack, which is what the OLED's u8g2 state gets overwritten by when the
; stack runs out - see the note in MazeMap.hpp.
build_flags =
	-DSERIAL_RX_BUFFER_SIZE=16
	-DSERIAL_TX_BUFFER_SIZE=32
	-mcall-prologues
	-Wl,--relax
lib_deps =
	pololu/VL6180X@1.4.0
	olikraus/U8g2@2.36.18
